name: Python package
on:
  push:
  pull_request:
    branches: [ dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run Linter
        run: uv run ruff check --output-format=github --target-version=py39
      - name: Run formatting
        run: uv run ruff format --diff --target-version=py39
        continue-on-error: true
      - name: Run tests
        run: uv run pytest
      - name: Dead code detection
        run: uv run vulture ./scripts ./tests --min-confidence 80
      - name: Code cyber bandit
        run: uv run bandit -r ./formation_mlops_2 ./scripts ./tests -ll
      - name: Secret leakage detection
        run: uv run detect-secrets scan --all-files 
  GACH-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Print "Hello"
        run: echo "Hello"
      - name: Print pwd
        run: pwd
       

